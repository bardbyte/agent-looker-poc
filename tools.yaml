# MCP Toolbox configuration for Looker
# Reference: https://googleapis.github.io/genai-toolbox/resources/tools/Looker/

sources:
  my-looker:
    kind: looker
    base_url: $LOOKER_INSTANCE_URL
    client_id: $LOOKER_CLIENT_ID
    client_secret: $LOOKER_CLIENT_SECRET
    verify_ssl: true
    timeout: 120s

# Toolsets allow loading groups of tools together
toolsets:
  # Conversational analytics — NLQ via Looker's semantic model
  conversational-analytics:
    - conversational-analytics

  # Schema discovery and querying
  data-exploration:
    - get-models
    - get-explores
    - get-dimensions
    - get-measures
    - get-filters
    - get-parameters
    - query
    - query-sql
    - query-url

  # Saved content
  saved-contents:
    - get-looks
    - run-look
    - get-dashboards
    - run-dashboard

  # Content creation
  content-creation:
    - make-look
    - make-dashboard
    - add-dashboard-element
    - add-dashboard-filter
    - generate-embed-url

  # LookML project management
  lookml-projects:
    - get-projects
    - get-project-files
    - get-project-file
    - get-project-directories
    - create-project-file
    - create-project-directory
    - update-project-file
    - delete-project-file
    - delete-project-directory
    - create-view-from-table
    - validate-project
    - dev-mode

  # Database connections
  connections:
    - get-connections
    - get-connection-databases
    - get-connection-schemas
    - get-connection-tables
    - get-connection-table-columns

  # Health and testing
  health:
    - health-pulse
    - health-analyze
    - health-vacuum
    - get-lookml-tests
    - run-lookml-tests
