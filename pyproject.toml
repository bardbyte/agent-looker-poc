[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "liteagent"
version = "0.2.0"
description = "Lightweight agent abstraction over MCP tools"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
adk = ["google-adk>=0.3.0"]
langgraph = ["langgraph>=0.2.0"]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
liteagent = "liteagent.agent:_cli_entry"

[tool.setuptools.packages.find]
where = ["src"]
